<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0a;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'DM Sans', sans-serif;
    overflow: hidden;
  }

  .ad-container {
    width: 520px;
    background: linear-gradient(145deg, #e8e4e0 0%, #dedad6 50%, #d4cfc9 100%);
    border: 1px solid #c8c2bc;
    border-radius: 4px;
    overflow: hidden;
    position: relative;
  }

  /* Subtle noise texture overlay */
  .ad-container::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.3;
  }

  .top-bar {
    background: #c8102e;
    padding: 7px 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    position: relative;
    z-index: 1;
  }

  .top-bar .dot {
    width: 6px;
    height: 6px;
    background: #fff;
    border-radius: 50%;
    opacity: 0.9;
    animation: blink 1.4s infinite;
  }

  .top-bar span {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 600;
    color: #fff;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  @keyframes blink {
    0%, 100% { opacity: 0.9; }
    50% { opacity: 0.3; }
  }

  .hero {
    position: relative;
    height: 300px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
  }

  /* Radial glow behind ring */
  .hero::before {
    content: '';
    position: absolute;
    width: 260px;
    height: 260px;
    background: radial-gradient(circle, rgba(200,16,46,0.08) 0%, transparent 70%);
    border-radius: 50%;
  }

  .ring-svg {
    width: 200px;
    height: 200px;
    filter: drop-shadow(0 0 20px rgba(200,16,46,0.25)) drop-shadow(0 12px 28px rgba(0,0,0,0.35));
    animation: float 4s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0px) rotate(-2deg); }
    50% { transform: translateY(-8px) rotate(2deg); }
  }

  .badge-limited {
    position: absolute;
    top: 20px;
    right: 20px;
    background: #c8102e;
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 5px 10px;
    border-radius: 2px;
  }

  .content {
    padding: 20px 28px 28px;
    position: relative;
    z-index: 1;
  }

  .brand {
    font-size: 10px;
    letter-spacing: 3px;
    color: #555;
    text-transform: uppercase;
    font-weight: 500;
    margin-bottom: 6px;
  }

  .product-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 72px;
    color: #1a1a1a;
    line-height: 1;
    letter-spacing: 2px;
    margin-bottom: 4px;
  }

  .product-name span {
    color: #c8102e;
  }

  .product-type {
    font-size: 11px;
    color: #555;
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: 500;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .product-type::before {
    content: '';
    display: inline-block;
    width: 16px;
    height: 1px;
    background: #c8102e;
    opacity: 0.7;
  }

  .tagline {
    font-size: 13px;
    color: #666;
    font-weight: 400;
    margin-bottom: 20px;
    letter-spacing: 0.3px;
  }

  .divider {
    height: 1px;
    background: linear-gradient(to right, #d0cbc6, #b0aaa4, #d0cbc6);
    margin-bottom: 20px;
  }

  .features {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
    margin-bottom: 20px;
  }

  .feature {
    text-align: center;
  }

  .feature-icon {
    width: 28px;
    height: 28px;
    margin: 0 auto 6px;
    opacity: 0.9;
  }

  .feature-label {
    font-size: 10px;
    color: #555;
    text-transform: uppercase;
    letter-spacing: 1px;
    line-height: 1.4;
  }

  .feature-value {
    font-size: 13px;
    color: #1a1a1a;
    font-weight: 500;
  }


  .price-row {
    display: flex;
    align-items: flex-end;
    gap: 12px;
    margin-bottom: 14px;
  }

  .price-current {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 42px;
    color: #1a1a1a;
    line-height: 1;
  }


  .cta-button {
    width: 100%;
    background: #c8102e;
    color: #fff;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    border: none;
    padding: 15px 20px;
    border-radius: 2px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }

  .cta-button::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.06) 0%, transparent 100%);
  }

  .guarantee {
    text-align: center;
    margin-top: 12px;
    font-size: 11px;
    color: #3a3a3a;
    letter-spacing: 0.3px;
  }

  .guarantee span {
    color: #484848;
  }
</style>
</head>
<body>
<div class="ad-container">
  <div class="top-bar">
    <div class="dot"></div>
    <span>Aura Athletics — Advanced Health Tracking</span>
    <div class="dot"></div>
  </div>

  <div class="hero">
    <svg class="ring-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="ringFace" cx="35%" cy="30%" r="65%">
          <stop offset="0%" stop-color="#4a4a4a"/>
          <stop offset="40%" stop-color="#1e1e1e"/>
          <stop offset="100%" stop-color="#0a0a0a"/>
        </radialGradient>
        <radialGradient id="ringHighlight" cx="30%" cy="25%" r="60%">
          <stop offset="0%" stop-color="#787878" stop-opacity="1"/>
          <stop offset="60%" stop-color="#2a2a2a" stop-opacity="1"/>
          <stop offset="100%" stop-color="#0d0d0d" stop-opacity="1"/>
        </radialGradient>
        <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#1a1a1a"/>
          <stop offset="100%" stop-color="#050505"/>
        </radialGradient>
        <linearGradient id="rimLight" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#888"/>
          <stop offset="30%" stop-color="#3a3a3a"/>
          <stop offset="70%" stop-color="#111"/>
          <stop offset="100%" stop-color="#555"/>
        </linearGradient>
        <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#8b0000"/>
          <stop offset="50%" stop-color="#c8102e"/>
          <stop offset="100%" stop-color="#8b0000"/>
        </linearGradient>
        <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.8"/>
        </filter>
      </defs>

      <!-- Outer ring body -->
      <ellipse cx="100" cy="104" rx="72" ry="24" fill="#0d0d0d" opacity="0.3"/>

      <!-- Main ring outer shape -->
      <circle cx="100" cy="100" r="72" fill="url(#rimLight)" />

      <!-- Ring body with metallic gradient -->
      <circle cx="100" cy="100" r="68" fill="url(#ringHighlight)" />

      <!-- Inner hole -->
      <circle cx="100" cy="100" r="44" fill="url(#innerGlow)" />

      <!-- Inner hole dark ring -->
      <circle cx="100" cy="100" r="44" fill="none" stroke="#0a0a0a" stroke-width="2"/>

      <!-- Specular highlight arc top-left -->
      <path d="M 48 72 Q 72 44 105 42" fill="none" stroke="#aaa" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

      <!-- Secondary highlight -->
      <path d="M 52 82 Q 70 58 98 52" fill="none" stroke="#777" stroke-width="1" stroke-linecap="round" opacity="0.4"/>

      <!-- Red accent stripe -->
      <path d="M 60 128 Q 100 144 140 128" fill="none" stroke="url(#redAccent)" stroke-width="3" stroke-linecap="round" opacity="0.9"/>

      <!-- Small sensor nodes (realistic detail) -->
      <circle cx="100" cy="154" r="5" fill="#111" stroke="#2a2a2a" stroke-width="1"/>
      <circle cx="100" cy="154" r="2.5" fill="#1a1a1a"/>
      <circle cx="88" cy="152" r="3" fill="#111" stroke="#222" stroke-width="1"/>
      <circle cx="112" cy="152" r="3" fill="#111" stroke="#222" stroke-width="1"/>

      <!-- Subtle engraving line on inner edge -->
      <circle cx="100" cy="100" r="48" fill="none" stroke="#1f1f1f" stroke-width="1" opacity="0.8"/>

      <!-- Bottom rim reflected light -->
      <path d="M 58 128 Q 100 148 142 128" fill="none" stroke="#3a3a3a" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    </svg>


  </div>

  <div class="content">
    <div class="brand">Aura Athletics</div>
    <div class="product-name">Pulse <span>X1</span></div>
    <div class="product-type">Smart Fitness Ring</div>
    <div class="tagline">Advanced health tracking. 7-day battery. Titanium build.</div>

    <div class="divider"></div>

    <div class="features">
      <div class="feature">
        <svg class="feature-icon" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M14 4C8.477 4 4 8.477 4 14s4.477 10 10 10 10-4.477 10-10S19.523 4 14 4z" stroke="#333" stroke-width="1.5"/>
          <path d="M14 8v6l4 2" stroke="#c8102e" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <div class="feature-value">7-Day</div>
        <div class="feature-label">Battery Life</div>
      </div>
      <div class="feature">
        <svg class="feature-icon" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 14h3l3-6 4 12 3-8 2 4 2-2h3" stroke="#c8102e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="feature-value">24/7 HRV</div>
        <div class="feature-label">Heart Tracking</div>
      </div>
      <div class="feature">
        <svg class="feature-icon" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="14" cy="14" r="9" stroke="#333" stroke-width="1.5"/>
          <path d="M11 14l2 2 4-4" stroke="#c8102e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="feature-value">IP68</div>
        <div class="feature-label">Waterproof</div>
      </div>
    </div>

    <div class="price-row">
      <div class="price-current">$299</div>
    </div>

    <button class="cta-button">Shop Now →</button>

    <div class="guarantee">
      <span>✓ Free shipping</span> &nbsp;·&nbsp;
      <span>✓ 30-day returns</span> &nbsp;·&nbsp;
      <span>✓ 2-yr warranty</span>
    </div>
  </div>
</div>


</body>
</html>
