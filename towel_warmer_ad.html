<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Jost:wght@300;400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #f8f4ef;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Jost', sans-serif;
  }

  .ad {
    width: 520px;
    background: #f8f4ef;
    overflow: hidden;
  }

  .top-ribbon {
    background: #2c2c2c;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 9px 20px;
  }

  .ribbon-dot { width: 5px; height: 5px; background: #c9a96e; border-radius: 50%; animation: blink 1.6s infinite; }
  .ribbon-dot:nth-child(3) { animation-delay: 0.8s; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

  .ribbon-text {
    font-size: 10px;
    color: #c9a96e;
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: 500;
  }

  .hero {
    background: #2c2c2c;
    height: 340px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .hero-grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(201,169,110,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(201,169,110,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  .steam-container {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 200px;
    height: 100px;
    display: flex;
    justify-content: space-around;
    align-items: flex-end;
  }

  .steam {
    width: 3px;
    border-radius: 3px;
    background: rgba(201,169,110,0.18);
    animation: steam-rise 3s ease-in-out infinite;
    transform-origin: bottom center;
  }
  .steam:nth-child(1) { height: 50px; animation-delay: 0s; }
  .steam:nth-child(2) { height: 70px; animation-delay: 0.5s; }
  .steam:nth-child(3) { height: 55px; animation-delay: 1s; }
  .steam:nth-child(4) { height: 65px; animation-delay: 0.3s; }
  .steam:nth-child(5) { height: 45px; animation-delay: 0.8s; }

  @keyframes steam-rise {
    0% { transform: scaleX(1) translateY(0); opacity: 0.6; }
    50% { transform: scaleX(1.4) translateY(-15px); opacity: 0.3; }
    100% { transform: scaleX(0.8) translateY(-30px); opacity: 0; }
  }

  .warmer-wrap {
    position: relative;
    z-index: 2;
    margin-top: 30px;
    animation: float 5s ease-in-out infinite;
  }

  @keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  .corner-tag {
    position: absolute;
    top: 18px;
    right: 18px;
    background: #c9a96e;
    color: #2c2c2c;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 5px 11px;
    border-radius: 1px;
  }

  .body {
    padding: 26px 30px 30px;
  }

  .pre-title {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
  }

  .gold-line { width: 24px; height: 1px; background: #c9a96e; }

  .pre-text {
    font-size: 10px;
    color: #c9a96e;
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: 500;
  }

  .product-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 72px;
    font-weight: 600;
    color: #1e1e1e;
    line-height: 1;
    letter-spacing: -2px;
    margin-bottom: 2px;
    text-shadow: 0 2px 12px rgba(201,169,110,0.15);
  }

  .product-name em {
    font-style: italic;
    color: #c9a96e;
  }

  .product-type {
    font-size: 11px;
    color: #888;
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: 500;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .product-type::before {
    content: '';
    display: inline-block;
    width: 18px;
    height: 1px;
    background: #c9a96e;
    opacity: 0.6;
  }

  .tagline {
    font-size: 12px;
    color: #999;
    font-weight: 300;
    letter-spacing: 0.5px;
    margin-bottom: 22px;
  }

  .features-strip {
    display: flex;
    border: 1px solid #e8e0d4;
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 20px;
  }

  .feat {
    flex: 1;
    padding: 13px 10px;
    text-align: center;
    border-right: 1px solid #e8e0d4;
  }
  .feat:last-child { border-right: none; }

  .feat-val {
    display: block;
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    font-weight: 600;
    color: #1e1e1e;
    line-height: 1;
    margin-bottom: 3px;
  }

  .feat-lbl {
    font-size: 10px;
    color: #aaa;
    letter-spacing: 1px;
    text-transform: uppercase;
  }



  .t-group { display: flex; align-items: center; gap: 5px; }

  .t-pill {
    background: #2c2c2c;
    border-radius: 3px;
    padding: 6px 10px;
    text-align: center;
    min-width: 48px;
  }

  .t-num {
    display: block;
    font-family: 'Cormorant Garamond', serif;
    font-size: 26px;
    font-weight: 600;
    color: #f0e8d8;
    line-height: 1;
  }

  .t-unit {
    display: block;
    font-size: 9px;
    color: #555;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: 2px;
  }

  .t-colon {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    color: #444;
    padding-bottom: 12px;
  }

  .checkout-row {
    display: flex;
    align-items: stretch;
    gap: 14px;
    margin-bottom: 14px;
  }

  .price-block { flex: 0 0 auto; }

  .price-main {
    font-family: 'Cormorant Garamond', serif;
    font-size: 48px;
    font-weight: 600;
    color: #1e1e1e;
    line-height: 1;
  }

  .price-row-sub {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 3px;
  }

  .price-old {
    font-size: 14px;
    color: #ccc;
    text-decoration: line-through;
  }

  .save-badge {
    background: #c9a96e;
    color: #2c2c2c;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 2px 7px;
    border-radius: 1px;
  }

  .buy-btn {
    flex: 1;
    background: #2c2c2c;
    color: #f0e8d8;
    border: none;
    border-radius: 2px;
    font-family: 'Jost', sans-serif;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }

  .buy-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(201,169,110,0.08) 0%, transparent 60%);
  }

  .trust-strip {
    display: flex;
    justify-content: center;
    gap: 22px;
  }

  .trust-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: #bbb;
    font-weight: 300;
  }

  .tick {
    width: 13px; height: 13px;
    border-radius: 50%;
    border: 1px solid #ddd;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
</style>

<div class="ad">

  <div class="top-ribbon">
    <div class="ribbon-dot"></div>
    <div class="ribbon-text">Winter Collection — Lux Home Wellness</div>
    <div class="ribbon-dot"></div>
  </div>

  <div class="hero">
    <div class="hero-grid"></div>

    <div class="steam-container">
      <div class="steam"></div>
      <div class="steam"></div>
      <div class="steam"></div>
      <div class="steam"></div>
      <div class="steam"></div>
    </div>

    <div class="warmer-wrap">
      <svg width="180" height="230" viewBox="0 0 180 230" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Cylinder body: left-to-right for 3D roundness -->
          <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%"   stop-color="#2e2e2e"/>
            <stop offset="15%"  stop-color="#4e4e4e"/>
            <stop offset="35%"  stop-color="#6e6e6e"/>
            <stop offset="50%"  stop-color="#7e7e7e"/>
            <stop offset="65%"  stop-color="#636363"/>
            <stop offset="85%"  stop-color="#444"/>
            <stop offset="100%" stop-color="#2a2a2a"/>
          </linearGradient>
          <!-- Gold rim -->
          <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%"   stop-color="#7a5a20"/>
            <stop offset="25%"  stop-color="#c9a96e"/>
            <stop offset="50%"  stop-color="#edd080"/>
            <stop offset="75%"  stop-color="#c9a96e"/>
            <stop offset="100%" stop-color="#7a5a20"/>
          </linearGradient>
          <!-- Inside of canister (dark) -->
          <radialGradient id="insideGrad" cx="50%" cy="30%" r="70%">
            <stop offset="0%"   stop-color="#3a3a3a"/>
            <stop offset="100%" stop-color="#111"/>
          </radialGradient>
          <!-- Top opening ellipse -->
          <radialGradient id="openingGrad" cx="40%" cy="35%" r="65%">
            <stop offset="0%"   stop-color="#555"/>
            <stop offset="100%" stop-color="#1a1a1a"/>
          </radialGradient>
          <!-- Towel inside -->
          <linearGradient id="towelInside" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%"   stop-color="#f0e6d8"/>
            <stop offset="100%" stop-color="#d8c8b0"/>
          </linearGradient>
          <!-- Lid gradient -->
          <linearGradient id="lidGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%"   stop-color="#2a2a2a"/>
            <stop offset="30%"  stop-color="#5a5a5a"/>
            <stop offset="50%"  stop-color="#6e6e6e"/>
            <stop offset="70%"  stop-color="#5a5a5a"/>
            <stop offset="100%" stop-color="#2a2a2a"/>
          </linearGradient>
          <!-- Shine -->
          <linearGradient id="shineV" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%"   stop-color="rgba(255,255,255,0.14)"/>
            <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
          </linearGradient>
          <linearGradient id="shineH" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%"   stop-color="rgba(255,255,255,0)"/>
            <stop offset="40%"  stop-color="rgba(255,255,255,0.18)"/>
            <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
          </linearGradient>
        </defs>

        <!-- Drop shadow -->
        <ellipse cx="90" cy="224" rx="52" ry="6" fill="#000" opacity="0.3"/>

        <!-- ── BODY ── wide short canister -->
        <!-- Main cylinder walls -->
        <rect x="22" y="70" width="136" height="148" fill="url(#bodyGrad)"/>

        <!-- Left curved edge (dark) -->
        <ellipse cx="22" cy="144" rx="6" ry="74" fill="#222"/>
        <!-- Right curved edge -->
        <ellipse cx="158" cy="144" rx="6" ry="74" fill="#2a2a2a"/>

        <!-- Vertical shine streak -->
        <rect x="52" y="70" width="14" height="148" fill="url(#shineV)" opacity="0.6"/>

        <!-- Horizontal gold band near top of body -->
        <rect x="22" y="78" width="136" height="9" fill="url(#goldRim)"/>
        <rect x="22" y="78" width="136" height="3" fill="rgba(255,255,255,0.12)"/>

        <!-- Horizontal gold band near bottom -->
        <rect x="22" y="200" width="136" height="9" fill="url(#goldRim)"/>
        <rect x="22" y="200" width="136" height="3" fill="rgba(255,255,255,0.12)"/>

        <!-- Bottom ellipse cap -->
        <ellipse cx="90" cy="218" rx="68" ry="9" fill="#1e1e1e"/>
        <ellipse cx="90" cy="218" rx="68" ry="9" fill="url(#shineH)" opacity="0.4"/>

        <!-- ── TOP OPENING ── open canister top with towels inside -->
        <!-- Outer rim (gold) -->
        <ellipse cx="90" cy="70" rx="68" ry="16" fill="url(#goldRim)"/>
        <!-- Inner rim dark ring -->
        <ellipse cx="90" cy="70" rx="60" ry="12" fill="#1e1e1e"/>
        <!-- Inside depth -->
        <ellipse cx="90" cy="72" rx="56" ry="10" fill="url(#insideGrad)"/>

        <!-- ── TOWELS STUFFED INSIDE (fluffy rolls visible from top) ── -->
        <!-- Back towel roll -->
        <ellipse cx="90" cy="62" rx="38" ry="8" fill="#cec0aa" opacity="0.6"/>
        <!-- Main towel bundle, puffing up out of the canister -->
        <!-- Left puff -->
        <ellipse cx="62" cy="58" rx="22" ry="14" fill="url(#towelInside)"/>
        <ellipse cx="62" cy="56" rx="20" ry="11" fill="#f2e8da"/>
        <!-- texture lines left puff -->
        <line x1="44" y1="54" x2="80" y2="54" stroke="#d8c8b2" stroke-width="0.6" opacity="0.7"/>
        <line x1="43" y1="58" x2="81" y2="58" stroke="#d8c8b2" stroke-width="0.6" opacity="0.5"/>
        <line x1="44" y1="62" x2="80" y2="62" stroke="#d8c8b2" stroke-width="0.6" opacity="0.4"/>

        <!-- Right puff -->
        <ellipse cx="116" cy="58" rx="22" ry="14" fill="url(#towelInside)"/>
        <ellipse cx="116" cy="56" rx="20" ry="11" fill="#ede3d4"/>
        <!-- texture lines right puff -->
        <line x1="98"  y1="54" x2="134" y2="54" stroke="#d8c8b2" stroke-width="0.6" opacity="0.7"/>
        <line x1="97"  y1="58" x2="135" y2="58" stroke="#d8c8b2" stroke-width="0.6" opacity="0.5"/>
        <line x1="98"  y1="62" x2="134" y2="62" stroke="#d8c8b2" stroke-width="0.6" opacity="0.4"/>

        <!-- Center puff (front-most, slightly higher) -->
        <ellipse cx="90" cy="52" rx="20" ry="13" fill="#f5ede0"/>
        <ellipse cx="90" cy="50" rx="18" ry="10" fill="#faf4ec"/>
        <line x1="73" y1="48" x2="107" y2="48" stroke="#e0d0ba" stroke-width="0.6" opacity="0.7"/>
        <line x1="72" y1="52" x2="108" y2="52" stroke="#e0d0ba" stroke-width="0.6" opacity="0.5"/>
        <line x1="73" y1="56" x2="107" y2="56" stroke="#e0d0ba" stroke-width="0.6" opacity="0.4"/>

        <!-- Rim highlight over towels -->
        <ellipse cx="90" cy="70" rx="68" ry="16" fill="none" stroke="url(#goldRim)" stroke-width="2"/>

        <!-- ── CONTROL PANEL on front face ── -->
        <!-- Panel background -->
        <rect x="68" y="148" width="44" height="36" rx="4" fill="#1a1a1a"/>
        <rect x="70" y="150" width="40" height="32" rx="3" fill="#222"/>
        <!-- Power dial -->
        <circle cx="82" cy="162" r="8" fill="#111" stroke="#c9a96e" stroke-width="1.5"/>
        <circle cx="82" cy="162" r="4" fill="#c9a96e" opacity="0.9"/>
        <circle cx="82" cy="162" r="2" fill="#ffdd88"/>
        <!-- Indicator light -->
        <circle cx="102" cy="158" r="3" fill="#c9a96e" opacity="0.9"/>
        <circle cx="102" cy="158" r="3" fill="#ffee88" opacity="0.5"/>
        <!-- Tiny label -->
        <rect x="96" y="165" width="14" height="4" rx="1" fill="#333"/>
        <rect x="98" y="166" width="10" height="2" rx="0.5" fill="#555"/>

        <!-- Handle on right side -->
        <path d="M158,110 Q178,110 178,130 Q178,150 158,150" fill="none" stroke="url(#goldRim)" stroke-width="5" stroke-linecap="round"/>
        <path d="M158,110 Q174,110 174,130 Q174,150 158,150" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="corner-tag">Spa Edition</div>
  </div>

  <div class="body">

    <div class="pre-title">
      <div class="gold-line"></div>
      <div class="pre-text">Lux Home Wellness</div>
    </div>

    <div class="product-name">Calor <em>Pro</em></div>
    <div class="product-type">Luxury Heated Towel Warmer</div>
    <div class="tagline">Hotel-grade warmth. Designed for your home sanctuary.</div>

    <div class="features-strip">
      <div class="feat">
        <span class="feat-val">68°C</span>
        <span class="feat-lbl">Max Heat</span>
      </div>
      <div class="feat">
        <span class="feat-val">15m</span>
        <span class="feat-lbl">Heat-up</span>
      </div>
      <div class="feat">
        <span class="feat-val">Wi-Fi</span>
        <span class="feat-lbl">App Control</span>
      </div>
      <div class="feat">
        <span class="feat-val">Dual</span>
        <span class="feat-lbl">Zone Heating</span>
      </div>
    </div>

    <div class="checkout-row">
      <div class="price-block">
        <div class="price-main">$269</div>
      </div>
      <button class="buy-btn">Shop Now →</button>

    <div class="trust-strip">
      <div class="trust-item">
        <div class="tick">
          <svg width="8" height="8" viewBox="0 0 8 8"><path d="M1.5 4l2 2 3-3" stroke="#999" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        Free white-glove delivery
      </div>
      <div class="trust-item">
        <div class="tick">
          <svg width="8" height="8" viewBox="0 0 8 8"><path d="M1.5 4l2 2 3-3" stroke="#999" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        60-day returns
      </div>
      <div class="trust-item">
        <div class="tick">
          <svg width="8" height="8" viewBox="0 0 8 8"><path d="M1.5 4l2 2 3-3" stroke="#999" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        3-yr warranty
      </div>
    </div>

  </div>
</div>
