<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@300;400;500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #f5f0e8;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Archivo', sans-serif;
  }

  .ad {
    width: 520px;
    background: #f5f0e8;
    position: relative;
    overflow: hidden;
  }

  .header {
    background: #1a1a1a;
    padding: 10px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .brand-name {
    font-family: 'Archivo Black', sans-serif;
    font-size: 13px;
    color: #f5f0e8;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .header-badge {
    background: #e8a020;
    color: #1a1a1a;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 1px;
  }

  .hero {
    background: #1a1a1a;
    position: relative;
    height: 320px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .hero-bg-circles {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .bg-ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(232, 160, 32, 0.08);
  }

  .speaker-wrap {
    position: relative;
    z-index: 2;
    animation: breathe 5s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { transform: scale(1) translateY(0); }
    50% { transform: scale(1.02) translateY(-5px); }
  }

  .sound-waves {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    z-index: 1;
  }

  .wave-ring {
    position: absolute;
    border-radius: 50%;
    border: 1.5px solid rgba(232, 160, 32, 0.25);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    animation: wave-expand 2.4s ease-out infinite;
  }
  .wave-ring:nth-child(2) { animation-delay: 0.8s; }
  .wave-ring:nth-child(3) { animation-delay: 1.6s; }

  @keyframes wave-expand {
    0% { width: 180px; height: 180px; opacity: 0.6; }
    100% { width: 320px; height: 320px; opacity: 0; }
  }

  .hero-label {
    position: absolute;
    bottom: 18px;
    right: 20px;
    font-size: 10px;
    color: rgba(245, 240, 232, 0.3);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .body {
    padding: 24px 28px 28px;
  }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }

  .eyebrow-line {
    width: 28px;
    height: 2px;
    background: #e8a020;
  }

  .eyebrow-text {
    font-size: 10px;
    color: #888;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    font-weight: 500;
  }

  .product-title {
    font-family: 'Archivo Black', sans-serif;
    font-size: 48px;
    color: #1a1a1a;
    line-height: 0.95;
    margin-bottom: 6px;
    letter-spacing: -1px;
  }

  .product-subtitle {
    font-size: 13px;
    color: #888;
    font-weight: 300;
    margin-bottom: 22px;
    letter-spacing: 0.2px;
  }

  .specs-row {
    display: flex;
    gap: 0;
    margin-bottom: 22px;
    border: 1px solid #ddd8ce;
    border-radius: 2px;
    overflow: hidden;
  }

  .spec {
    flex: 1;
    padding: 12px 14px;
    border-right: 1px solid #ddd8ce;
    text-align: center;
  }

  .spec:last-child { border-right: none; }

  .spec-val {
    font-family: 'Archivo Black', sans-serif;
    font-size: 18px;
    color: #1a1a1a;
    display: block;
    line-height: 1;
    margin-bottom: 3px;
  }

  .spec-label {
    font-size: 10px;
    color: #999;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .scarcity-block {
    background: #1a1a1a;
    border-radius: 2px;
    padding: 16px 18px;
    margin-bottom: 18px;
  }

  .sc-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .sc-alert {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 11px;
    color: #e8a020;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .pulse-dot {
    width: 7px;
    height: 7px;
    background: #e8a020;
    border-radius: 50%;
    animation: pulse-dot 1.5s ease-in-out infinite;
  }

  @keyframes pulse-dot {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.4); opacity: 0.6; }
  }

  .sc-count {
    font-size: 11px;
    color: #555;
  }

  .sc-count strong {
    color: #e8a020;
    font-weight: 700;
  }

  .stock-bar {
    height: 3px;
    background: #2e2e2e;
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 6px;
  }

  .stock-fill {
    height: 100%;
    width: 78%;
    background: #e8a020;
    border-radius: 2px;
  }

  .sc-bottom {
    display: flex;
    justify-content: space-between;
  }

  .sc-note {
    font-size: 11px;
    color: #444;
  }

  .sc-sold {
    font-size: 11px;
    color: #444;
  }

  .timer-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
  }

  .timer-eyebrow {
    font-size: 10px;
    color: #999;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    white-space: nowrap;
  }

  .timer-blocks {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .t-block {
    text-align: center;
  }

  .t-num {
    display: block;
    font-family: 'Archivo Black', sans-serif;
    font-size: 24px;
    color: #1a1a1a;
    background: #ede8de;
    border-radius: 2px;
    padding: 4px 10px;
    min-width: 48px;
    line-height: 1;
  }

  .t-unit {
    display: block;
    font-size: 9px;
    color: #bbb;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: 3px;
  }

  .t-sep {
    font-family: 'Archivo Black', sans-serif;
    font-size: 20px;
    color: #ccc;
    padding-bottom: 14px;
  }

  .price-cta {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 14px;
  }

  .price-col {
    flex: 0 0 auto;
  }

  .price-now {
    font-family: 'Archivo Black', sans-serif;
    font-size: 44px;
    color: #1a1a1a;
    line-height: 1;
  }

  .price-was {
    font-size: 14px;
    color: #bbb;
    text-decoration: line-through;
  }

  .price-save-pill {
    display: inline-block;
    background: #e8a020;
    color: #1a1a1a;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 3px 8px;
    border-radius: 1px;
    margin-top: 3px;
  }

  .cta-btn {
    flex: 1;
    background: #1a1a1a;
    color: #f5f0e8;
    border: none;
    border-radius: 2px;
    padding: 18px 14px;
    font-family: 'Archivo Black', sans-serif;
    font-size: 13px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }

  .cta-btn::after {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 60px; height: 100%;
    background: rgba(255,255,255,0.06);
    transform: skewX(-20deg);
    animation: shimmer 3s ease-in-out infinite;
  }

  @keyframes shimmer {
    0% { left: -100%; }
    50%, 100% { left: 120%; }
  }

  .trust-row {
    display: flex;
    justify-content: center;
    gap: 20px;
  }

  .trust-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: #aaa;
  }

  .trust-check {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #ddd8ce;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
</style>
